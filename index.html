<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sight Games | v1.2</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap");
      
      :root {
        --text-color: white;
        --accent-color: #4b87f7;
        --glass-bg: rgba(255,255,255,0.1);
        --glass-border: rgba(255,255,255,0.2);
      }

      * {
        font-family: 'Ubuntu', sans-serif;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
                    url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxMSEhMTExMWFhUXFxUaFxcYGBoWGBUVGBUXFxg") center/cover fixed;
        color: var(--text-color);
        min-height: 100vh;
        overflow-x: hidden;
        backdrop-filter: blur(10px);
      }

      .center {
        justify-content: center;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 6rem);
        font-weight: 700;
        background: linear-gradient(45deg, #fff, var(--accent-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(75, 135, 247, 0.5);
        margin-bottom: 10px;
        animation: glow 2s ease-in-out infinite alternate;
      }

      @keyframes glow {
        from { filter: drop-shadow(0 0 20px #4b87f70.5); }
        to { filter: drop-shadow(0 0 40px #4b87f70.8); }
      }

      #subtitle {
        font-size: 1.5rem;
        opacity: 0.9;
        font-weight: 300;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      }

      #searchInput {
        padding: 20px 30px;
        width: 100%;
        max-width: 500px;
        margin: 40px auto;
        border-radius: 50px;
        border: 2px solid var(--glass-border);
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        font-size: 1.3rem;
        color: white;
        outline: none;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        position: relative;
      }

      #searchInput::placeholder {
        color: rgba(255,255,255,0.7);
      }

      #searchInput:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 4px rgba(75, 135, 247, 0.2), 0 20px 40px rgba(0,0,0,0.5);
        transform: scale(1.02);
      }

      #gamesContainer {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 25px;
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .game {
        text-align: center;
        border-radius: 20px;
        overflow: hidden;
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        border: 1px solid var(--glass-border);
        cursor: pointer;
        position: relative;
        transform: translateY(0);
      }

      .game::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(75,135,247,0.1), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
      }

      .game:hover::before {
        opacity: 1;
      }

      .game:hover {
        transform: translateY(-15px) scale(1.05);
        box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 0 1px var(--accent-color);
        border-color: var(--accent-color);
      }

      .game img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        transition: transform 0.4s ease;
        border-radius: 18px 18px 0 0;
      }

      .game:hover img {
        transform: scale(1.1);
      }

      .game p {
        padding: 20px 15px;
        font-weight: 600;
        font-size: 16px;
        margin: 0;
        position: relative;
        z-index: 2;
      }

      .footer {
        margin: 60px auto 40px;
        text-align: center;
        font-size: 18px;
        opacity: 0.9;
      }

      .link {
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 700;
        text-shadow: 0 0 10px rgba(75, 135, 247, 0.5);
      }

      .link:hover {
        text-shadow: 0 0 20px rgba(75, 135, 247, 0.8);
      }

      @media (max-width: 768px) {
        #gamesContainer {
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap: 20px;
          padding: 20px 10px;
        }
        
        .game:hover {
          transform: translateY(-10px) scale(1.02);
        }
      }

      @media (max-width: 480px) {
        #gamesContainer {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }
        
        h1 { font-size: 2.5rem; }
        #searchInput { margin: 20px auto; padding: 15px 20px; }
      }
    </style>
  </head>
  <body>
    <div class="center">
      <h1 id="title">Sight Games</h1>
      <p id="subtitle">v1.2</p>
    </div>
    
    <div class="center">
      <input type="text" id="searchInput" placeholder="🔍 Search games..." />
    </div>
    
    <div id="gamesContainer"></div>
    
    <div class="footer">
      <a style="font-weight: 700">a site by </a>
      <a href="https://dsc.gg/parcoil" class="link">parcoil network</a>
    </div>

    <script>
      const serverUrl = "https://gms.parcoil.com";
      
      // ADD YOUR FULL GAMES LIST HERE
      const games = [
        {"name":"1v1lol","image":"logo.png","url":"1v1lol"},
        {"name":"1v1space","image":"splash.png","url":"1v1space"},
        {"name":"10 Minutes Till Dawn","image":"splash.png","url":"10-minutes-till-dawn"},
        {"name":"100ng","image":"100ng.jpg","url":"100ng"},
        {"name":"2048","image":"2048.png","url":"2048"}
        // ... add all your games
      ];

      function displayGames(gamesToShow) {
        const container = document.getElementById('gamesContainer');
        container.innerHTML = '';

        gamesToShow.forEach(game => {
          const gameDiv = document.createElement('div');
          gameDiv.className = 'game';

          const gameImg = document.createElement('img');
          gameImg.src = `${serverUrl}/${game.url}/${game.image}`;
          gameImg.alt = game.name;
          gameImg.onclick = () => {
            window.location.href = `/play.html?gameurl=${game.url}/`;
          };

          const gameName = document.createElement('p');
          gameName.textContent = game.name;

          gameDiv.appendChild(gameImg);
          gameDiv.appendChild(gameName);
          container.appendChild(gameDiv);
        });
      }

      // Search
      document.getElementById('searchInput').addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filteredGames = games.filter(game => 
          game.name.toLowerCase().includes(searchTerm)
        );
        displayGames(filteredGames);
      });

      // Initial load
      displayGames(games);
    </script>
  </body>
</html>
